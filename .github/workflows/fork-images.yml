name: fork images

# The server + webui images for THIS fork's own namespace.
#
# `release.yml` also builds images, but its tags are hardcoded to
# `ghcr.io/dorskfr/...`: on a fork that job can only fail, since its token
# cannot write to the upstream namespace. This workflow publishes the same two
# images under the fork owner's namespace instead, so a release no longer needs
# a local `make image/release` on a machine whose disk a Cargo build fills.
#
# Deliberately no `:latest`: a deployment pins an immutable digest, and a
# moving tag only makes it harder to tell what is running.
#
# First run of a new package: ghcr creates it PRIVATE. A cluster that pulls
# anonymously (ours does, it has no imagePullSecrets) needs the package set to
# public once, by hand, in the owner's package settings. Until then, keep
# deploying the images pushed to the internal registry.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.15.10)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-images-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      # Checked out at the workflow's own commit first: the tag a dispatch
      # names is data, and is validated before anything is checked out from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version and namespace
        id: ctx
        env:
          # Through the environment, never interpolated into the script: an
          # input is untrusted text, not shell.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${REF#refs/tags/}}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refusing: '$tag' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$tag"
          {
            echo "version=${tag#v}"
            # The commit actually built, which a dispatch's github.sha is not.
            echo "sha=$(git rev-parse --short=12 HEAD)"
            # ghcr namespaces are lowercase; the owner's login may not be.
            echo "ns=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only, like the local builds the cluster runs today.
      - name: Build + push server image
        id: server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CCTUI_GIT_HASH=${{ steps.ctx.outputs.sha }}
          tags: ghcr.io/${{ steps.ctx.outputs.ns }}/cctui:${{ steps.ctx.outputs.version }}

      - name: Build + push webui image
        id: webui
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: webui/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CLIENT_VERSION=${{ steps.ctx.outputs.version }}
          tags: ghcr.io/${{ steps.ctx.outputs.ns }}/cctui-ui:${{ steps.ctx.outputs.version }}

      # The same two images as OCI archives, attached to the run. A run
      # artifact downloads with the plain `repo` scope (`gh run download`),
      # unlike a ghcr package that is born private: this is what lets an agent
      # mirror the CI build into the internal registry without a packages
      # token. Both exports are cache hits on the builds above.
      - name: Export server image (OCI archive)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: |
            CCTUI_GIT_HASH=${{ steps.ctx.outputs.sha }}
          tags: ghcr.io/${{ steps.ctx.outputs.ns }}/cctui:${{ steps.ctx.outputs.version }}
          outputs: type=oci,dest=/tmp/cctui-server.tar

      - name: Export webui image (OCI archive)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: webui/Dockerfile
          platforms: linux/amd64
          build-args: |
            CLIENT_VERSION=${{ steps.ctx.outputs.version }}
          tags: ghcr.io/${{ steps.ctx.outputs.ns }}/cctui-ui:${{ steps.ctx.outputs.version }}
          outputs: type=oci,dest=/tmp/cctui-ui.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: images-${{ steps.ctx.outputs.version }}
          path: |
            /tmp/cctui-server.tar
            /tmp/cctui-ui.tar
          retention-days: 3
          if-no-files-found: error

      # The digests a deployment should pin, rather than the tags above.
      - name: Digests to pin
        run: |
          {
            echo "### Images ${{ steps.ctx.outputs.version }}"
            echo
            echo '```'
            echo "ghcr.io/${{ steps.ctx.outputs.ns }}/cctui@${{ steps.server.outputs.digest }}"
            echo "ghcr.io/${{ steps.ctx.outputs.ns }}/cctui-ui@${{ steps.webui.outputs.digest }}"
            echo '```'
            echo
            echo "Built from ${{ steps.ctx.outputs.sha }}."
          } >> "$GITHUB_STEP_SUMMARY"
