name: schema-drift

# Re-fetch the upstream Claude Code settings JSON schema and diff it against the
# vendored copy consumed by the settings catalog (CCT-537). The schema drives the
# types/enums/defaults for the ~84 keys it covers, so drift here means the catalog's
# machine-readable half is stale and should be re-vendored + the hand-maintained
# delta (catalog.toml) reviewed for newly added / removed keys.
#
# The `codex` job does the same for codex's config.schema.json, pinned to the
# CODEX_MIN_VERSION release, and checks that every codex-catalog.toml key still
# exists upstream with the type cctui renders it as.
#
# Neither job edits the repo; it only flags drift so a human re-vendors on purpose.

on:
  schedule:
    # Weekly, Mondays 07:17 UTC (off the top-of-hour to avoid the fleet stampede).
    - cron: "17 7 * * 1"
  workflow_dispatch: {}
  push:
    paths:
      - "crates/cctui-server/src/settings_catalog/claude-code-settings.schema.json"
      - "crates/cctui-server/src/settings_catalog/codex-config.schema.json"
      - "crates/cctui-server/src/settings_catalog/codex-catalog.toml"
      - "crates/cctui-proto/src/codex_config.rs"
      - "crates/cctui-daemon/src/adapters/codex/contract.rs"
      - "scripts/check-codex-schema-drift.sh"
      - ".github/workflows/schema-drift.yml"

permissions:
  contents: read

jobs:
  diff:
    name: diff vendored schema vs upstream
    runs-on: ubuntu-latest
    env:
      SCHEMA_URL: https://json.schemastore.org/claude-code-settings.json
      VENDORED: crates/cctui-server/src/settings_catalog/claude-code-settings.schema.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch upstream schema
        run: curl -fsSL "$SCHEMA_URL" -o /tmp/upstream-schema.json

      - name: Normalize (stable key order) and diff
        run: |
          set -euo pipefail
          # Normalize both with jq -S so formatting/key-order changes don't cause
          # false drift — only real content changes trip the diff.
          jq -S . "$VENDORED" > /tmp/vendored.norm.json
          jq -S . /tmp/upstream-schema.json > /tmp/upstream.norm.json
          if diff -u /tmp/vendored.norm.json /tmp/upstream.norm.json; then
            echo "✅ Vendored schema is in sync with upstream."
          else
            echo "::error::Claude Code settings schema drift detected."
            echo "Upstream $SCHEMA_URL differs from the vendored copy at $VENDORED."
            echo "Re-vendor it and review catalog.toml for added/removed keys:"
            echo "  curl -fsSL $SCHEMA_URL -o $VENDORED"
            echo "Then run: cargo test -p cctui-server settings_catalog"
            exit 1
          fi

      - name: Report new / removed top-level properties
        if: always()
        run: |
          set -euo pipefail
          jq -r '.properties | keys[]' "$VENDORED" | sort > /tmp/vendored.keys
          jq -r '.properties | keys[]' /tmp/upstream-schema.json | sort > /tmp/upstream.keys
          {
            echo "### Property drift"
            echo '```'
            echo "added upstream (not vendored):"
            comm -13 /tmp/vendored.keys /tmp/upstream.keys || true
            echo "removed upstream (still vendored):"
            comm -23 /tmp/vendored.keys /tmp/upstream.keys || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  codex:
    name: codex catalog keys vs upstream config schema
    runs-on: ubuntu-latest
    env:
      VENDORED: crates/cctui-server/src/settings_catalog/codex-config.schema.json
      SCHEMA_PATH: codex-rs/core/config.schema.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the floor and upstream latest versions
        run: |
          set -euo pipefail
          floor="$(sed -n 's/.*CODEX_MIN_VERSION: &str = "\([^"]*\)".*/\1/p' crates/cctui-daemon/src/adapters/codex/contract.rs | head -n1)"
          latest="$(curl -fsSL https://api.github.com/repos/openai/codex/releases/latest \
            | sed -n 's/.*"tag_name": *"rust-v\([0-9.]*\)".*/\1/p' | head -n1)"
          echo "FLOOR=$floor" >> "$GITHUB_ENV"
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          curl -fsSL "https://raw.githubusercontent.com/openai/codex/rust-v$floor/$SCHEMA_PATH" -o /tmp/floor-schema.json
          curl -fsSL "https://raw.githubusercontent.com/openai/codex/rust-v$latest/$SCHEMA_PATH" -o /tmp/latest-schema.json

      - name: Vendored schema is the floor release's
        run: |
          set -euo pipefail
          jq -S . "$VENDORED" > /tmp/vendored.norm.json
          jq -S . /tmp/floor-schema.json > /tmp/floor.norm.json
          if ! diff -u /tmp/vendored.norm.json /tmp/floor.norm.json; then
            echo "::error::$VENDORED is not codex $FLOOR's $SCHEMA_PATH."
            echo "Re-vendor it: curl -fsSL https://raw.githubusercontent.com/openai/codex/rust-v$FLOOR/$SCHEMA_PATH -o $VENDORED"
            exit 1
          fi

      - name: Catalogued keys exist at the floor with the expected type
        run: SCHEMA_LABEL="codex $FLOOR" scripts/check-codex-schema-drift.sh "$VENDORED"

      - name: Catalogued keys vs upstream latest
        if: always()
        run: |
          set -euo pipefail
          if [ "$LATEST" = "$FLOOR" ]; then
            echo "Floor $FLOOR is upstream latest; nothing more to check."
          elif ! SCHEMA_LABEL="codex $LATEST" scripts/check-codex-schema-drift.sh /tmp/latest-schema.json; then
            echo "::warning::Raising CODEX_MIN_VERSION from $FLOOR to $LATEST would break catalogued keys; fix codex-catalog.toml and CURATED with the bump."
          fi

      - name: Report new / removed top-level properties since the floor
        if: always()
        run: |
          set -euo pipefail
          jq -r '.properties | keys[]' "$VENDORED" | sort > /tmp/floor.keys
          jq -r '.properties | keys[]' /tmp/latest-schema.json | sort > /tmp/latest.keys
          {
            echo "### Codex config property drift ($FLOOR → $LATEST)"
            echo '```'
            echo "added upstream (not vendored):"
            comm -13 /tmp/floor.keys /tmp/latest.keys || true
            echo "removed upstream (still vendored):"
            comm -23 /tmp/floor.keys /tmp/latest.keys || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
