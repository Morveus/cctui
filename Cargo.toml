[workspace]
resolver = "2"
members = [
    "crates/cctui-admin",
    "crates/cctui-crypto",
    "crates/cctui-daemon",
    "crates/cctui-dispatcher-apple",
    "crates/cctui-dispatcher-core",
    "crates/cctui-dispatcher-docker",
    "crates/cctui-dispatcher-kube",
    "crates/cctui-guard",
    "crates/cctui-guard-proxy",
    "crates/cctui-orchestrator",
    "crates/cctui-proto",
    "crates/cctui-query",
    "crates/cctui-server",
    "crates/cctui-supervisor",
    "crates/cctui-tui",
]

[workspace.package]
version = "0.15.7"
edition = "2024"
license = "MIT"
authors = ["DorskFR"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
cctui-proto = { path = "crates/cctui-proto" }
cctui-crypto = { path = "crates/cctui-crypto" }
cctui-query = { path = "crates/cctui-query" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query", "form"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.23"
zstd = "0.14"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
thiserror = "2"
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http"] }
aws-credential-types = "1"
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "derive", "admission"] }
json-patch = "4"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
schemars = { version = "1.2", features = ["derive"] }
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
