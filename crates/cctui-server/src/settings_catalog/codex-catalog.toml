# Codex config.toml settings catalog — policy tags and labels over the vendored
# `codex-config.schema.json` (codex-rs/core/config.schema.json at the tag below).
#
# Reference: https://learn.chatgpt.com/docs/config-file/config-reference
# Verified against codex-cli 0.153.4.
# The version above must equal contract::CODEX_MIN_VERSION, and the vendored
# schema must be that release's; scripts/check-codex-schema-drift.sh enforces both.
#
# Policy tags:
#   safe    — good per-account default, low blast radius
#   care    — exposable but has caveats (cost / privacy / footgun)
#   managed — cctui owns this key per session; a per-account value must never
#             clobber the gateway wiring or the permission posture
#   system  — not exposable as a per-account key
#
# Every exposable key must also appear in `cctui_proto::codex_config::CURATED`,
# which renders it into both injection paths; a test holds the two in exact
# agreement, so adding a key here without a renderer entry fails the build.

reference_url = "https://learn.chatgpt.com/docs/config-file/config-reference"
captured = "2026-09-10"

# ---- speed / cost ---------------------------------------------------------

[[keys]]
name = "service_tier"
group = "Speed & cost"
label = "Fast mode"
tag = "care"
source = "schema"
type = "string"
enum = "default, fast"
default = "default"
notes = "`fast` maps to the request tier `priority` — 1.5x speed, increased usage, same model and same quality. Codex's own default is `priority` for every gpt-5.x model, so cctui pins `default` unless asked. A per-session toggle overrides this account default."

# ---- reasoning / output ---------------------------------------------------

[[keys]]
name = "model_reasoning_summary"
group = "Reasoning"
label = "Reasoning summary"
tag = "safe"
source = "schema"
type = "string"
enum = "auto, concise, detailed, none"
notes = "how much of the model's reasoning is summarised back into the transcript"

[[keys]]
name = "model_verbosity"
group = "Reasoning"
label = "Verbosity"
tag = "safe"
source = "schema"
type = "string"
enum = "low, medium, high"
notes = "GPT-5 text verbosity"

[[keys]]
name = "plan_mode_reasoning_effort"
group = "Reasoning"
label = "Plan-mode effort"
tag = "safe"
source = "schema"
type = "string"
enum = "minimal, low, medium, high"
notes = "reasoning effort while planning; the session's own effort still applies to the work"

[[keys]]
name = "personality"
group = "Reasoning"
label = "Personality"
tag = "safe"
source = "schema"
type = "string"
notes = "named response personality; unset = the codex default"

# ---- privacy --------------------------------------------------------------

[[keys]]
name = "history.persistence"
group = "Privacy"
label = "History persistence"
tag = "care"
source = "schema"
type = "string"
enum = "save-all, none"
default = "save-all"
notes = "`none` stops codex writing the local ~/.codex history file; cctui's own transcript is unaffected"

# ---- cctui-managed --------------------------------------------------------
# Set per session by the daemon (config_overrides / gateway_provider_overrides)
# or by the k8s worker entrypoint. A per-account value here would either break
# gateway routing or silently override the session's permission posture.

[[keys]]
name = "model"
tag = "managed"
source = "schema"
notes = "per-session; account-level lives in default_model / the alias map"

[[keys]]
name = "model_reasoning_effort"
tag = "managed"
source = "schema"
notes = "per-session; account-level lives in default_effort"

[[keys]]
name = "approval_policy"
tag = "managed"
source = "schema"
notes = "encodes PermissionMode — cctui owns it"

[[keys]]
name = "sandbox_mode"
tag = "managed"
source = "schema"
notes = "encodes PermissionMode — cctui owns it"

[[keys]]
name = "sandbox_workspace_write"
tag = "managed"
source = "schema"
notes = "sandbox escape hatches; rides sandbox_mode"

[[keys]]
name = "model_provider"
tag = "managed"
source = "schema"
notes = "gateway routing — overriding this bypasses metering and soft limits"

[[keys]]
name = "model_providers"
tag = "managed"
source = "schema"
notes = "gateway routing — the `cctui` provider block is written per session"

[[keys]]
name = "openai_base_url"
tag = "managed"
source = "schema"
notes = "gateway routing"

[[keys]]
name = "chatgpt_base_url"
tag = "managed"
source = "schema"
notes = "gateway routing"

[[keys]]
name = "forced_login_method"
tag = "managed"
source = "schema"
notes = "account identity — cctui mints the credential"

[[keys]]
name = "forced_chatgpt_workspace_id"
tag = "managed"
source = "schema"
notes = "account identity — cctui mints the credential"

[[keys]]
name = "oss_provider"
tag = "managed"
source = "schema"
notes = "routes off the gateway entirely"

# ---- typed keys, unblocked by the shared TOML emitter -----------------------
# cctui_proto::codex_config renders these as real TOML literals (bare booleans
# and integers), so they no longer have to be quoted strings. A server test
# holds this exposable set to exact agreement with that renderer's CURATED list.

[[keys]]
name = "web_search"
group = "Tools"
label = "Web search"
tag = "care"
source = "schema"
type = "string"
enum = "disabled, cached, indexed, live"
notes = "lets the model search the web mid-turn; egress + cost"

[[keys]]
name = "hide_agent_reasoning"
group = "Reasoning"
label = "Hide reasoning"
tag = "safe"
source = "schema"
type = "boolean"
notes = "suppresses reasoning events from the stream"

[[keys]]
name = "show_raw_agent_reasoning"
group = "Reasoning"
label = "Raw reasoning"
tag = "care"
source = "schema"
type = "boolean"
notes = "emits raw chain-of-thought where the model exposes it; verbose transcripts"

[[keys]]
name = "check_for_update_on_startup"
group = "Quiet"
label = "Check for updates"
tag = "safe"
source = "schema"
type = "boolean"
default = "true"
notes = "cctui pins the codex version per machine/pod, so the startup check is pure noise"

[[keys]]
name = "model_context_window"
group = "Context"
label = "Context window"
tag = "care"
source = "schema"
type = "number"
notes = "overrides the model's advertised context window; too high and turns fail upstream"

[[keys]]
name = "model_auto_compact_token_limit"
group = "Context"
label = "Auto-compact limit"
tag = "care"
source = "schema"
type = "number"
notes = "token count at which codex auto-compacts; lower trades context for cost"

# ---- still not renderable ---------------------------------------------------

[[keys]]
name = "features.fast_mode"
tag = "system"
source = "schema"
type = "boolean"
default = "true"
notes = "gates whether the tier selector is offered, NOT the tier itself; a process-level value would mask the per-session toggle"

[[presets]]
id = "quiet-defaults"
name = "Quiet defaults"
description = "Stop codex writing its own local history file, skip the startup update check (cctui pins the codex version per machine and per pod), and keep raw chain-of-thought out of the transcript."

[presets.settings]
"history.persistence" = "none"
check_for_update_on_startup = false
show_raw_agent_reasoning = false
